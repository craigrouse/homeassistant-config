id: '1627507277461'
alias: 'Powerwall: Manual Export Controller'
description: 'Enables manual force export for X hours using input_number duration, pushing a 3-period TOU export spike (isolating
  peak to duration window) and performing a 3m Kickstart nudge if the export has not started. 2026-09-02: the kickstart test
  now uses GRID power (sensor.rouse_house_pw3_grid_power > -1 kW = not exporting) instead of battery power - house load of
  ~1.2 kW from the battery defeated the old battery_power<1 test tonight, so the nudge never fired while the gateway ignored
  the export plan. Toggle spacing raised 5s -> 45s to match the Export Watchdog (the 5s version raced Tesla cloud sync). Tariff-first
  ordering (2026-09-02): export TOU push, 15s settle, then grid switch, reserve, export, mode - the gateway checks the tariff
  before honouring the other settings (see Daily Scheduler). 2026-09-03: kickstart test reads the LOCAL gateway site-power
  sensor (30s cadence) instead of the cloud-polled Teslemetry grid sensor, which lags ~1 min.'
triggers:
- entity_id:
  - input_boolean.manual_export_active
  id: start
  to: 'on'
  trigger: state
- entity_id:
  - input_boolean.manual_export_active
  id: stop
  to: 'off'
  trigger: state
- entity_id:
  - timer.manual_export_countdown
  id: timer_finished
  to: idle
  trigger: state
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - start
    sequence:
    - action: timer.start
      data:
        duration: '{{ (states(''input_number.manual_export_duration_hours'') | float(1.0) * 3600) | int }}'
      target:
        entity_id: timer.manual_export_countdown
    - action: teslemetry.time_of_use
      data:
        device_id: dd527e4bc7ab1a14f356f9973480e7f7
        tou_settings: |-
          {% set now_dt = now() %}
          {% set dur_hours = states('input_number.manual_export_duration_hours') | float(1.0) %}
          {% set start_dt = now_dt | as_local %}
          {% set end_dt = (now_dt + timedelta(hours=dur_hours)) | as_local %}
          {% set start_hour = start_dt.hour | int %}
          {% set start_minute = start_dt.minute | int %}
          {% set end_hour = end_dt.hour | int %}
          {% set end_minute = end_dt.minute | int %}

          {% if end_dt.day == start_dt.day %}
            {% set off_peak_periods = [
              {'fromDayOfWeek': 0, 'fromHour': 0, 'fromMinute': 0, 'toDayOfWeek': 6, 'toHour': start_hour, 'toMinute': start_minute},
              {'fromDayOfWeek': 0, 'fromHour': end_hour, 'fromMinute': end_minute, 'toDayOfWeek': 6, 'toHour': 0, 'toMinute': 0}
            ] %}
            {% set on_peak_periods = [
              {'fromDayOfWeek': 0, 'fromHour': start_hour, 'fromMinute': start_minute, 'toDayOfWeek': 6, 'toHour': end_hour, 'toMinute': end_minute}
            ] %}
          {% else %}
            {% set off_peak_periods = [
              {'fromDayOfWeek': 0, 'fromHour': end_hour, 'fromMinute': end_minute, 'toDayOfWeek': 6, 'toHour': start_hour, 'toMinute': start_minute}
            ] %}
            {% set on_peak_periods = [
              {'fromDayOfWeek': 0, 'fromHour': start_hour, 'fromMinute': start_minute, 'toDayOfWeek': 6, 'toHour': 0, 'toMinute': 0},
              {'fromDayOfWeek': 0, 'fromHour': 0, 'fromMinute': 0, 'toDayOfWeek': 6, 'toHour': end_hour, 'toMinute': end_minute}
            ] %}
          {% endif %}

          {{ {
            'break_even_cost_to_charge': 0,
            'mode': 'time_of_use',
            'tariff_content_v2': {
              'code': 'MANUAL-EXPORT-ISOLATED-SPIKE',
              'currency': 'GBP',
              'daily_charges': [{'amount': 0, 'name': 'Charge'}],
              'demand_charges': {'ALL': {'rates': {'ALL': 0}}},
              'energy_charges': {
                'ALL': {'rates': {'ALL': 0}},
                'AllYear': {'rates': {'OFF_PEAK': 0.07, 'ON_PEAK': 3.00}}
              },
              'name': 'Manual Force Export Spike',
              'seasons': {
                'AllYear': {
                  'fromDay': 1, 'fromMonth': 1, 'toDay': 31, 'toMonth': 12,
                  'tou_periods': {
                    'OFF_PEAK': {'periods': off_peak_periods},
                    'ON_PEAK': {'periods': on_peak_periods}
                  }
                }
              },
              'sell_tariff': {
                'currency': 'GBP',
                'daily_charges': [{'amount': 0, 'name': 'Charge'}],
                'demand_charges': {'ALL': {'rates': {'ALL': 0}}},
                'energy_charges': {
                  'ALL': {'rates': {'ALL': 0}},
                  'AllYear': {'rates': {'OFF_PEAK': 0.00, 'ON_PEAK': 2.90}}
                },
                'name': 'Manual Force Export Spike',
                'seasons': {
                  'AllYear': {
                    'fromDay': 1, 'fromMonth': 1, 'toDay': 31, 'toMonth': 12,
                    'tou_periods': {
                      'OFF_PEAK': {'periods': off_peak_periods},
                      'ON_PEAK': {'periods': on_peak_periods}
                    }
                  }
                },
                'utility': 'Octopus Energy'
              },
              'utility': 'Octopus Energy',
              'version': 1
            }
          } }}
    - delay:
        seconds: 15
    - action: switch.turn_on
      target:
        entity_id:
        - switch.rouse_house_pw3_allow_charging_from_grid
    - action: number.set_value
      data:
        value: 0
      target:
        entity_id:
        - number.rouse_house_pw3_backup_reserve
    - action: select.select_option
      data:
        option: battery_ok
      target:
        entity_id:
        - select.rouse_house_pw3_allow_export
    - action: select.select_option
      data:
        option: autonomous
      target:
        entity_id:
        - select.rouse_house_pw3_operation_mode
    - delay:
        minutes: 3
    - if:
      - condition: numeric_state
        entity_id: sensor.powerwall_192_168_1_182_site_power
        above: -1
      then:
      - action: select.select_option
        data:
          option: self_consumption
        target:
          entity_id:
          - select.rouse_house_pw3_operation_mode
      - delay:
          seconds: 45
      - action: select.select_option
        data:
          option: autonomous
        target:
          entity_id:
          - select.rouse_house_pw3_operation_mode
      - action: notify.send_message
        data:
          message: 'Manual Export: grid export was still below 1 kW after 3m. Toggled Self-Powered -> 45s -> Autonomous to
            wake up the Tesla Gateway.'
          title: '⚡ Powerwall Watchdog: Kickstart Nudge Executed'
        target:
          entity_id: notify.pixel_10_pro_xl
  - conditions:
    - condition: trigger
      id:
      - stop
      - timer_finished
    sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.manual_export_active
    - action: timer.cancel
      target:
        entity_id: timer.manual_export_countdown
    - action: automation.trigger
      target:
        entity_id: automation.powerwall_daily_scheduler
      data:
        skip_condition: false
mode: restart
