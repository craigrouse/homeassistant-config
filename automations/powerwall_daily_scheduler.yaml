id: '1780438384579'
alias: 'Powerwall: Daily Scheduler'
description: 'Master controller for all standard daily Powerwall state transitions, overnight arbitrage, EV slot sync, and
  safety protections. TOU pushed to the gateway ends off-peak at 05:15 (not 05:30): the gateway sometimes finishes its charge
  plan with a full-rate sprint that straddles the boundary (1.7 kWh of peak-rate import on 2026-08-26), so a 15-minute buffer
  keeps the sprint inside the cheap window. The 05:30 triggers/windows here are unchanged deliberately - only the tariff boundary
  moves. Charge-cap guard (2026-08-29): daytime smart-slot posture additionally requires sensor.tesla_charging_time_daily
  < 6h (Octopus 6h/day smart-charge cap, 12:00-12:00 window); the charge_cap_reached trigger re-runs the scheduler the moment
  the cap is crossed mid-dispatch so the PW never grid-charges at peak. TARIFF-FIRST ORDERING (2026-09-02): the TOU push now
  goes first, then a 15s settle, then grid switch, reserve, export and finally operation mode. Since gateway firmware 26.2
  the Powerwall checks the tariff before honouring reserve/mode/charging changes (PowerSync findings in alandtse/tesla#1171);
  pushing the tariff LAST meant reserve/mode landed against the OLD tariff and the gateway ignored them - the 2026-09-02 22:30
  smart-slot fill never started until a manual mode toggle at 22:57. Mode is deliberately last: the mode write is what makes
  the gateway re-plan. 2026-09-04: the evening dump is paused for any live car dispatch (smart-slot refill posture instead)
  and resumes when the slot ends; the evening planner now subtracts planned slot time and adds the expected refill when computing
  the dump start.'
triggers:
- at: input_datetime.time_to_start_exporting
  id: evening_export_start
  trigger: time
- at: input_datetime.octopus_off_peak_start
  id: off_peak_start
  trigger: time
- at: 01:30:00
  id: night_dump_start
  trigger: time
- at: 02:50:00
  id: night_charge_start
  trigger: time
- at: 05:30:00
  id: off_peak_end
  trigger: time
- at: 05:31:00
  id: morning_failsafe_check
  trigger: time
- at: '10:59:00'
  id: solar_optimize_start
  trigger: time
- below: 12
  entity_id: sensor.rouse_house_pw3_percentage_charged
  id: evening_failsafe_trigger
  trigger: numeric_state
- below: 3
  entity_id: sensor.rouse_house_pw3_percentage_charged
  id: night_dump_failsafe
  trigger: numeric_state
- entity_id: binary_sensor.tesla_wall_connector_contactor_closed
  for: 00:01:00
  id: car_charge_detected
  to: 'on'
  trigger: state
- entity_id: sensor.meilin_charging
  for: 00:01:00
  id: car_charge_detected
  to: charging
  trigger: state
- entity_id: binary_sensor.charging
  for: 00:01:00
  id: car_charge_detected
  to: 'on'
  trigger: state
- entity_id: binary_sensor.octopus_energy_00000000_0002_4000_8020_0000000dc626_intelligent_dispatching
  for: 00:01:00
  id: car_charge_detected
  to: 'on'
  trigger: state
- entity_id: binary_sensor.octopus_energy_00000000_0002_4000_8020_00000010fcb0_intelligent_dispatching
  for: 00:01:00
  id: car_charge_detected
  to: 'on'
  trigger: state
- entity_id: binary_sensor.tesla_wall_connector_contactor_closed
  for:
    minutes: 5
  id: car_charge_stopped
  to: 'off'
  trigger: state
- entity_id: sensor.meilin_charging
  for:
    minutes: 5
  from: charging
  id: car_charge_stopped
  trigger: state
- entity_id: binary_sensor.charging
  for:
    minutes: 5
  id: car_charge_stopped
  to: 'off'
  trigger: state
- entity_id: binary_sensor.octopus_energy_00000000_0002_4000_8020_0000000dc626_intelligent_dispatching
  id: car_charge_stopped
  trigger: state
- entity_id: binary_sensor.octopus_energy_00000000_0002_4000_8020_00000010fcb0_intelligent_dispatching
  id: car_charge_stopped
  trigger: state
- id: off_peak_cycle
  minutes: /30
  trigger: time_pattern
- entity_id: sensor.octopus_energy_electricity_19l4137057_2700005580134_current_rate
  id: price_changed
  trigger: state
- below: 80
  entity_id: sensor.rouse_house_pw3_percentage_charged
  id: soc_below_80
  trigger: numeric_state
- at: '16:00:00'
  id: afternoon_peak_start
  trigger: time
- entity_id: input_datetime.time_to_start_exporting
  id: export_time_changed
  trigger: state
- entity_id: sensor.tesla_charging_time_daily
  above: 5.99
  id: charge_cap_reached
  trigger: numeric_state
conditions:
- condition: state
  entity_id: binary_sensor.octopus_paid_saving_session_active
  state: 'off'
- condition: state
  entity_id: input_boolean.manual_export_active
  state: 'off'
- condition: state
  entity_id: input_boolean.start_manual_force_import
  state: 'off'
- condition: state
  entity_id: input_boolean.power_hour_active
  state: 'off'
actions:
- action: teslemetry.time_of_use
  data:
    device_id: dd527e4bc7ab1a14f356f9973480e7f7
    tou_settings: '{{ schedule.tou_settings }}'
- delay:
    seconds: 15
- action: switch.turn_{{ schedule.allow_charging_from_grid }}
  target:
    entity_id:
    - switch.rouse_house_pw3_allow_charging_from_grid
- action: number.set_value
  data:
    value: '{{ schedule.charge_target_soc }}'
  target:
    entity_id:
    - number.rouse_house_pw3_backup_reserve
- action: select.select_option
  data:
    option: '{{ ''battery_ok'' if schedule.is_dump else ''pv_only'' }}'
  target:
    entity_id:
    - select.rouse_house_pw3_allow_export
- action: select.select_option
  data:
    option: '{{ schedule.op_mode }}'
  target:
    entity_id:
    - select.rouse_house_pw3_operation_mode
mode: single
variables:
  schedule: |-
    {# Calculate current time windows #}
    {% set now_dt = now() %}
    {% set is_off_peak = (today_at('23:30') <= now_dt or now_dt < today_at('05:30')) %}
    {% set soc_now = states('sensor.rouse_house_pw3_percentage_charged') | float(0) %}
    {% set is_night_dump_window = (today_at('01:30') <= now_dt < today_at('02:50')) and soc_now > 3 %}
    {% set is_night_refill_window = (today_at('02:50') <= now_dt < today_at('05:30')) or ((today_at('01:30') <= now_dt < today_at('02:50')) and soc_now <= 3) %}

    {# Retrieve dynamic evening export start time helper #}
    {% set export_start_str = states('input_datetime.time_to_start_exporting') %}
    {% set export_start_time = today_at(export_start_str) if export_start_str is not none and export_start_str not in ['unknown', 'unavailable'] else today_at('21:50:00') %}
    {% set is_evening_dump_window = (export_start_time <= now_dt < today_at('23:30')) %}

    {# Determine plugged-in vehicle and its properties #}
    {% set wall_state = states('binary_sensor.tesla_wall_connector_vehicle_connected') %}
    {% set wall_plugged = wall_state == 'on' %}
    {% set wall_vehicle = states('sensor.wall_connector_vehicle') %}
    {% set tesla_in_charge = is_state('binary_sensor.meilin_charge_cable', 'on') or is_state('sensor.meilin_charging', 'charging') or is_state('binary_sensor.octopus_energy_00000000_0002_4000_8020_0000000dc626_intelligent_dispatching', 'on') %}
    {% set renault_in_charge = is_state('binary_sensor.charging', 'on') or is_state('binary_sensor.octopus_energy_00000000_0002_4000_8020_00000010fcb0_intelligent_dispatching', 'on') %}
    {% if wall_plugged %}
      {% if wall_vehicle == 'LRWYHCEK0NC406337' or is_state('binary_sensor.meilin_charge_cable', 'on') %}
        {% set tesla_plugged = true %}
        {% set renault_plugged = false %}
      {% else %}
        {% set tesla_plugged = false %}
        {% set renault_plugged = true %}
      {% endif %}
    {% elif wall_state in ['unavailable', 'unknown'] %}
      {% set tesla_plugged = tesla_in_charge %}
      {% set renault_plugged = (not tesla_plugged) and renault_in_charge %}
    {% else %}
      {% set tesla_plugged = false %}
      {% set renault_plugged = false %}
    {% endif %}

    {% if renault_plugged %}
      {% set car_needs_charge = (states('sensor.battery') | float(0)) < (states('number.octopus_energy_00000000_0002_4000_8020_00000010fcb0_intelligent_charge_target') | float(100)) %}
      {% set car_active = is_state('binary_sensor.charging', 'on') or is_state('binary_sensor.octopus_energy_00000000_0002_4000_8020_00000010fcb0_intelligent_dispatching', 'on') or is_state('binary_sensor.tesla_wall_connector_contactor_closed', 'on') %}
    {% elif tesla_plugged %}
      {% set car_needs_charge = (states('sensor.meilin_battery_level') | float(0)) < (states('number.octopus_energy_00000000_0002_4000_8020_0000000dc626_intelligent_charge_target') | float(100)) %}
      {% set car_active = is_state('sensor.meilin_charging', 'charging') or is_state('binary_sensor.octopus_energy_00000000_0002_4000_8020_0000000dc626_intelligent_dispatching', 'on') or is_state('binary_sensor.tesla_wall_connector_contactor_closed', 'on') %}
    {% else %}
      {% set car_needs_charge = false %}
      {% set car_active = false %}
    {% endif %}

    {# active_charge drives the SMART-SLOT posture (PW grid-charges at 6.9p). Tightened 2026-08-24: requires an ACTUAL dispatch or the off-peak window - contactor-closed alone is NOT a slot (a ~100% completion top-off closed the contactor at 11:53 and the PW grid-charged at peak rate until midday; the watchdog's scheduler re-trigger kept re-arming it). car_active stays loose for dump suppression. #}
    {% set dispatch_active = is_state('binary_sensor.octopus_energy_00000000_0002_4000_8020_0000000dc626_intelligent_dispatching', 'on') or is_state('binary_sensor.octopus_energy_00000000_0002_4000_8020_00000010fcb0_intelligent_dispatching', 'on') %}
    {# Octopus smart-charge cap (2026-08-29): max 6h of smart charging per 12:00-12:00 day (sensor.tesla_charging_time_daily mirrors Octopus's count; ALL smart charging counts, even inside 23:30-05:30). At/over the cap, daytime dispatches are no longer cheap, so the smart-slot posture requires cap headroom. The fixed 23:30-05:30 window is always off-peak regardless, so is_off_peak stays ungated. Sensor unavailable => assume capped (float(99)): worst case the PW skips a 6.9p fill instead of risking a peak-rate import. #}
    {% set cap_ok = states('sensor.tesla_charging_time_daily') | float(99) < 6 %}
    {% set active_charge = car_active and car_needs_charge and ((dispatch_active and cap_ok) or is_off_peak) %}
    {% set soc = states('sensor.rouse_house_pw3_percentage_charged') | float(0) %}

    {% set saving_session_active = is_state('binary_sensor.octopus_paid_saving_session_active', 'on') %}

    {# 2026-09-04: a live car dispatch PAUSES the evening dump too (previously only the night dump). Exporting while the car draws 7.4 kW nets at the meter, so the car ran off battery energy worth 12p instead of 6.9p grid. During the dispatch the smart-slot posture applies (PW refills at 6.9p, house at 6.9p); the dump resumes when the slot ends. #}
    {% set is_dump = ((is_evening_dump_window or is_night_dump_window) and not active_charge) if not saving_session_active else false %}
    {% set allow_grid_charge = 'on' if (is_off_peak or active_charge) else 'off' %}
    {% set charge_target_soc = 100 if (is_night_refill_window or (today_at('23:30') <= now_dt or now_dt < today_at('01:30')) or active_charge) else 0 %}
    {% set op_mode = 'autonomous' if (is_dump or is_off_peak or active_charge) else 'self_consumption' %}

    {% if is_dump %}
      {% set tariff_code = 'PEAK-EXPORT-OVERRIDE' %}
      {% set tariff_name = 'Peak Export Override' %}
      {% set on_peak_import_price = 1.50 %}
      {% set on_peak_export_price = 2.00 %}
      {% set off_peak_export_price = 0.05 %}
    {% elif active_charge %}
      {% set tariff_code = 'OCTOPUS-GO-SMART-SLOT' %}
      {% set tariff_name = 'Intelligent Octopus Go Smart Slot' %}
      {% set on_peak_import_price = 0.30 %}
      {% set on_peak_export_price = 0.15 %}
      {% set off_peak_export_price = 0.15 %}
    {% else %}
      {% set tariff_code = 'OCTOPUS-GO' %}
      {% set tariff_name = 'Intelligent Octopus Go Standard' %}
      {% set on_peak_import_price = 0.30 %}
      {% set on_peak_export_price = 0.15 %}
      {% set off_peak_export_price = 0.15 %}
    {% endif %}

    {# Calculate TOU period boundaries for active charge, dump window, or standard schedule #}
    {% if is_dump %}
      {% if is_night_dump_window %}
        {% set dump_start_h = 1 %}
        {% set dump_start_m = 30 %}
        {% set dump_end_h = 2 %}
        {% set dump_end_m = 50 %}
      {% else %}
        {% set dump_start_h = export_start_time.hour | int %}
        {% set dump_start_m = export_start_time.minute | int %}
        {% set dump_end_h = 23 %}
        {% set dump_end_m = 30 %}
      {% endif %}
      {% set off_peak_periods = [
        {'fromDayOfWeek': 0, 'fromHour': 0, 'fromMinute': 0, 'toDayOfWeek': 6, 'toHour': dump_start_h, 'toMinute': dump_start_m},
        {'fromDayOfWeek': 0, 'fromHour': dump_end_h, 'fromMinute': dump_end_m, 'toDayOfWeek': 6, 'toHour': 0, 'toMinute': 0}
      ] %}
      {% set on_peak_periods = [
        {'fromDayOfWeek': 0, 'fromHour': dump_start_h, 'fromMinute': dump_start_m, 'toDayOfWeek': 6, 'toHour': dump_end_h, 'toMinute': dump_end_m}
      ] %}
    {% elif active_charge and not is_off_peak %}
      {% set off_peak_start_h = now_dt.hour | int %}
      {% set off_peak_start_m = 0 %}
      {% set off_peak_end_h = 5 %}
      {% set off_peak_end_m = 15 %}
      {% set off_peak_periods = [
        {'fromDayOfWeek': 0, 'fromHour': off_peak_start_h, 'fromMinute': off_peak_start_m, 'toDayOfWeek': 6, 'toHour': off_peak_end_h, 'toMinute': off_peak_end_m}
      ] %}
      {% set on_peak_periods = [
        {'fromDayOfWeek': 0, 'fromHour': 5, 'fromMinute': 15, 'toDayOfWeek': 6, 'toHour': off_peak_start_h, 'toMinute': off_peak_start_m}
      ] %}
    {% else %}
      {% set off_peak_periods = [
        {'fromDayOfWeek': 0, 'fromHour': 23, 'fromMinute': 30, 'toDayOfWeek': 6, 'toHour': 5, 'toMinute': 15}
      ] %}
      {% set on_peak_periods = [
        {'fromDayOfWeek': 0, 'fromHour': 5, 'fromMinute': 15, 'toDayOfWeek': 6, 'toHour': 23, 'toMinute': 30}
      ] %}
    {% endif %}

    {% set tou_settings = {
      'break_even_cost_to_charge': 0,
      'mode': 'time_of_use',
      'tariff_content_v2': {
        'code': tariff_code,
        'currency': 'GBP',
        'daily_charges': [{'amount': 0, 'name': 'Charge'}],
        'demand_charges': {'ALL': {'rates': {'ALL': 0}}},
        'energy_charges': {
          'ALL': {'rates': {'ALL': 0}},
          'AllYear': {'rates': {'OFF_PEAK': 0.07, 'ON_PEAK': on_peak_import_price | float}}
        },
        'name': tariff_name,
        'seasons': {
          'AllYear': {
            'fromDay': 1, 'fromMonth': 1, 'toDay': 31, 'toMonth': 12,
            'tou_periods': {
              'OFF_PEAK': {'periods': off_peak_periods},
              'ON_PEAK': {'periods': on_peak_periods}
            }
          }
        },
        'sell_tariff': {
          'currency': 'GBP',
          'daily_charges': [{'amount': 0, 'name': 'Charge'}],
          'demand_charges': {'ALL': {'rates': {'ALL': 0}}},
          'energy_charges': {
            'ALL': {'rates': {'ALL': 0}},
            'AllYear': {'rates': {'OFF_PEAK': off_peak_export_price | float, 'ON_PEAK': on_peak_export_price | float}}
          },
          'name': tariff_name,
          'seasons': {
            'AllYear': {
              'fromDay': 1, 'fromMonth': 1, 'toDay': 31, 'toMonth': 12,
              'tou_periods': {
                'OFF_PEAK': {'periods': off_peak_periods},
                'ON_PEAK': {'periods': on_peak_periods}
              }
            }
          },
          'utility': 'Octopus Energy'
        },
        'utility': 'Octopus Energy',
        'version': 1
      }
    } %}
    {{ {
      'allow_charging_from_grid': allow_grid_charge,
      'charge_target_soc': charge_target_soc,
      'is_dump': is_dump,
      'op_mode': op_mode,
      'tou_settings': tou_settings
    } }}
