id: '1702159551670'
alias: 'Octopus Saving Session: Set time of next session'
description: 'Keeps input_datetime.octopus_saving_session_next_start / _end pointing at the next OR currently running joined
  Octoplus session. 2026-09-02: filter is end > now(), not start > now() - the old filter dropped the in-progress session
  at the first event-entity refresh after it started (20:12 tonight), resetting both helpers to the 2026-08-12 fallback mid-session
  and removing the Saving Session Controller redundant end trigger.'
triggers:
- entity_id: event.octopus_energy_a_dbae4963_octoplus_saving_session_events
  trigger: state
actions:
- action: input_datetime.set_datetime
  data:
    datetime: '{% set events = state_attr(''event.octopus_energy_a_dbae4963_octoplus_saving_session_events'', ''joined_events'')
      | default([], true) %}{% set future = events | selectattr(''end'', ''>'', now()) | sort(attribute=''start'') | list
      %}{{ future[0].start.strftime(''%Y-%m-%d %H:%M:%S'') if future | length > 0 else ''2026-08-12 18:00:00'' }}'
  target:
    entity_id: input_datetime.octopus_saving_session_next_start
- action: input_datetime.set_datetime
  data:
    datetime: '{% set events = state_attr(''event.octopus_energy_a_dbae4963_octoplus_saving_session_events'', ''joined_events'')
      | default([], true) %}{% set future = events | selectattr(''end'', ''>'', now()) | sort(attribute=''start'') | list
      %}{{ future[0].end.strftime(''%Y-%m-%d %H:%M:%S'') if future | length > 0 else ''2026-08-12 20:00:00'' }}'
  target:
    entity_id: input_datetime.octopus_saving_session_end
mode: single
