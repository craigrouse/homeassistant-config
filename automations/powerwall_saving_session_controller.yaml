id: '1780438387974'
alias: 'Powerwall: Saving Session Controller'
description: Runs ONLY for paid Octoplus Saving Sessions - gated by binary_sensor.octopus_paid_saving_session_active (octopoints_per_kwh
  > 0; free sessions are handled by the Power Hour controller). Triggered natively by the saving-sessions calendar, with the
  session input_datetimes as redundancy. Pushes a 3-period TOU export spike isolated to the session window and performs a
  3m Kickstart nudge if the battery is idle. The soc_low protection only acts while a paid session is active.
triggers:
- trigger: calendar
  entity_id: calendar.octopus_energy_a_dbae4963_octoplus_saving_sessions
  event: start
  offset: 00:00:15
  id: session_start
- trigger: calendar
  entity_id: calendar.octopus_energy_a_dbae4963_octoplus_saving_sessions
  event: end
  id: session_end
- at: input_datetime.octopus_saving_session_next_start
  id: session_start
  trigger: time
- at: input_datetime.octopus_saving_session_end
  id: session_end
  trigger: time
- below: 20
  entity_id: sensor.rouse_house_pw3_percentage_charged
  id: soc_low
  trigger: numeric_state
conditions:
- condition: state
  entity_id: input_boolean.manual_export_active
  state: 'off'
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - session_start
    - above: 20
      condition: numeric_state
      entity_id: sensor.rouse_house_pw3_percentage_charged
    - condition: state
      entity_id: binary_sensor.octopus_paid_saving_session_active
      state: 'on'
    sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.rouse_house_pw3_allow_charging_from_grid
    - action: teslemetry.time_of_use
      data:
        device_id: dd527e4bc7ab1a14f356f9973480e7f7
        tou_settings: |-
          {% set start_str = states('input_datetime.octopus_saving_session_next_start') %}
          {% set end_str = states('input_datetime.octopus_saving_session_end') %}
          {% set start_dt_raw = as_datetime(start_str) if start_str not in ['unknown','unavailable','none'] else today_at('18:00') %}
          {% set end_dt_raw = as_datetime(end_str) if end_str not in ['unknown','unavailable','none'] else today_at('19:00') %}
          {% set start_dt = today_at(start_dt_raw.strftime('%H:%M:%S')) if start_dt_raw is not none else today_at('18:00') %}
          {% set end_dt = today_at(end_dt_raw.strftime('%H:%M:%S')) if end_dt_raw is not none else today_at('19:00') %}
          {% set start_hour = start_dt.hour | int %}
          {% set start_minute = start_dt.minute | int %}
          {% set end_hour = end_dt.hour | int %}
          {% set end_minute = end_dt.minute | int %}

          {% if end_dt.day == start_dt.day %}
            {% set off_peak_periods = [
              {'fromDayOfWeek': 0, 'fromHour': 0, 'fromMinute': 0, 'toDayOfWeek': 6, 'toHour': start_hour, 'toMinute': start_minute},
              {'fromDayOfWeek': 0, 'fromHour': end_hour, 'fromMinute': end_minute, 'toDayOfWeek': 6, 'toHour': 0, 'toMinute': 0}
            ] %}
            {% set on_peak_periods = [
              {'fromDayOfWeek': 0, 'fromHour': start_hour, 'fromMinute': start_minute, 'toDayOfWeek': 6, 'toHour': end_hour, 'toMinute': end_minute}
            ] %}
          {% else %}
            {% set off_peak_periods = [
              {'fromDayOfWeek': 0, 'fromHour': end_hour, 'fromMinute': end_minute, 'toDayOfWeek': 6, 'toHour': start_hour, 'toMinute': start_minute}
            ] %}
            {% set on_peak_periods = [
              {'fromDayOfWeek': 0, 'fromHour': start_hour, 'fromMinute': start_minute, 'toDayOfWeek': 6, 'toHour': 0, 'toMinute': 0},
              {'fromDayOfWeek': 0, 'fromHour': 0, 'fromMinute': 0, 'toDayOfWeek': 6, 'toHour': end_hour, 'toMinute': end_minute}
            ] %}
          {% endif %}

          {{ {
            'break_even_cost_to_charge': 0,
            'mode': 'time_of_use',
            'tariff_content_v2': {
              'code': 'SAVING-SESSION-DUMP-ISOLATED',
              'currency': 'GBP',
              'daily_charges': [{'amount': 0, 'name': 'Charge'}],
              'demand_charges': {'ALL': {'rates': {'ALL': 0}}},
              'energy_charges': {
                'ALL': {'rates': {'ALL': 0}},
                'AllYear': {'rates': {'OFF_PEAK': 0.07, 'ON_PEAK': 3.00}}
              },
              'name': 'Saving Session Force Export Dump',
              'seasons': {
                'AllYear': {
                  'fromDay': 1, 'fromMonth': 1, 'toDay': 31, 'toMonth': 12,
                  'tou_periods': {
                    'OFF_PEAK': {'periods': off_peak_periods},
                    'ON_PEAK': {'periods': on_peak_periods}
                  }
                }
              },
              'sell_tariff': {
                'currency': 'GBP',
                'daily_charges': [{'amount': 0, 'name': 'Charge'}],
                'demand_charges': {'ALL': {'rates': {'ALL': 0}}},
                'energy_charges': {
                  'ALL': {'rates': {'ALL': 0}},
                  'AllYear': {'rates': {'OFF_PEAK': 0.00, 'ON_PEAK': 2.90}}
                },
                'name': 'Saving Session Force Export Dump',
                'seasons': {
                  'AllYear': {
                    'fromDay': 1, 'fromMonth': 1, 'toDay': 31, 'toMonth': 12,
                    'tou_periods': {
                      'OFF_PEAK': {'periods': off_peak_periods},
                      'ON_PEAK': {'periods': on_peak_periods}
                    }
                  }
                },
                'utility': 'Octopus Energy'
              },
              'utility': 'Octopus Energy',
              'version': 1
            }
          } }}
    - action: select.select_option
      data:
        option: battery_ok
      target:
        entity_id:
        - select.rouse_house_pw3_allow_export
    - action: select.select_option
      data:
        option: autonomous
      target:
        entity_id:
        - select.rouse_house_pw3_operation_mode
    - action: number.set_value
      data:
        value: 0
      target:
        entity_id:
        - number.rouse_house_pw3_backup_reserve
    - delay:
        minutes: 3
    - if:
      - below: 1
        condition: numeric_state
        entity_id: sensor.powerwall_192_168_1_182_battery_power
      then:
      - action: select.select_option
        data:
          option: self_consumption
        target:
          entity_id:
          - select.rouse_house_pw3_operation_mode
      - delay:
          seconds: 5
      - action: select.select_option
        data:
          option: autonomous
        target:
          entity_id:
          - select.rouse_house_pw3_operation_mode
      - action: notify.send_message
        data:
          message: Saving Session Export was idle after 3m. Toggled Self-Powered -> Autonomous to wake up Tesla Gateway! Battery
            is now exporting.
          title: '⚡ Powerwall Watchdog: Kickstart Nudge Executed'
        target:
          entity_id: notify.pixel_10_pro_xl
  - conditions:
    - condition: or
      conditions:
      - condition: trigger
        id:
        - session_end
      - condition: and
        conditions:
        - condition: trigger
          id:
          - soc_low
        - condition: state
          entity_id: binary_sensor.octopus_paid_saving_session_active
          state: 'on'
    sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.rouse_house_pw3_allow_charging_from_grid
    - action: automation.trigger
      target:
        entity_id: automation.powerwall_daily_scheduler
mode: single
