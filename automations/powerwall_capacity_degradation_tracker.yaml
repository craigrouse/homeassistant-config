id: '1786398848290'
alias: 'Powerwall 3: Auto-Track Full Capacity & Degradation'
description: Updates measured full pack capacity when Powerwall 3 reaches 100% state of charge.
triggers:
- entity_id: sensor.rouse_house_pw3_percentage_charged
  for:
    minutes: 5
  id: pw3_full
  to: '100'
  trigger: state
actions:
- action: input_number.set_value
  data:
    value: '{{ ((states(''sensor.powerwall_192_168_1_182_charge'') | float(100) / 100.0) * 27.0) | round(2) }}'
  target:
    entity_id: input_number.powerwall_3_measured_full_capacity
mode: single
